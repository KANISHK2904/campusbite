<div class="flex flex-col items-center text-center space-y-space-sm pt-space-xs">
<div class="relative flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container text-on-primary shadow-md">

<div class="flex items-center space-x-space-xs mt-space-xs">
<span class="font-headline-md text-headline-md tracking-tight text-on-surface">CampusBite</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md">
        Admin
      </span>
</div>
<div class="space-y-space-2xs max-w-xs">
<h1 class="font-title-md text-title-md text-on-surface">Partner &amp; Canteen Login</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Manage outlet orders, menu availability, and campus counter tokens.
      </p>
</div>
</div>
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-md shadow-sm space-y-space-md">
<form class="space-y-space-md" id="admin-login-form" onsubmit="event.preventDefault();">
<div class="space-y-space-2xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="username">

<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none select-none text-[20px]">
            person
          </span>
<input autocomplete="username" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md rounded-xl outline-none shadow-sm transition-all focus:bg-surface-container-lowest focus:ring-0" id="username" name="username" onblur="this.style.boxShadow='0 0 0 1px #e1bfb5'" onfocus="this.style.boxShadow='0 0 0 2px #ff6b35'" placeholder="Enter admin username" style="box-shadow: 0 0 0 1px #e1bfb5;" type="text"/>
</div>
</div>
<div class="space-y-space-2xs">
<div class="flex items-center justify-between">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">
            Password
          </label>

          </button>
</div>

<button aria-label="Toggle password visibility" class="absolute right-2.5 flex items-center justify-center w-8 h-8 rounded-lg text-on-surface-variant hover:text-on-surface active:bg-surface-container-high transition-colors" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">

</button>
</div>
</div>
<div class="pt-space-xs">
<button class="w-full h-12 flex items-center justify-center space-x-2 rounded-2xl bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm transition-all active:scale-[0.98] hover:opacity-95" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">

          </span>
</button>
</div>
</form>
<div class="pt-space-2xs pb-space-2xs text-center">

      </a>
</div>
</div>
<div class="flex items-center justify-center space-x-1.5 px-4 py-3 rounded-xl bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-secondary shrink-0" style="font-variation-settings: 'FILL' 1;">
      verified_user
    </span>
<span class="font-label-sm text-label-sm tracking-wide text-center">
      Campus Dining Partner Gateway · Authorized Outlets Only
    </span>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (passwordInput && toggleBtn && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
